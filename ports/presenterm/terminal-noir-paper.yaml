# Terminal Noir Paper for presenterm. https://terminalnoir.web.app
# Generated by scripts/build from palette/palette.json.
default:
  margin:
    percent: 8
  colors:
    foreground: palette:text
    background: palette:base
slide_title:
  alignment: center
  padding_bottom: 1
  padding_top: 1
  colors:
    foreground: palette:primary
  bold: true
  font_size: 2
code:
  alignment: center
  minimum_size: 50
  minimum_margin:
    percent: 8
  theme_name: terminal-noir-paper
  padding:
    horizontal: 2
    vertical: 1
execution_output:
  colors:
    foreground: palette:text
    background: palette:elevated
  status:
    running:
      foreground: palette:info
    success:
      foreground: palette:success
    failure:
      foreground: palette:error
    not_started:
      foreground: palette:primary
  padding:
    horizontal: 2
    vertical: 1
pty_output:
  colors:
    foreground: palette:text
    background: palette:elevated
  cursor:
    highlight_colors:
      foreground: palette:elevated
      background: palette:text
inline_code:
  colors:
    foreground: palette:success
    background: palette:raised
bold:
  colors:
    foreground: palette:primary
intro_slide:
  title:
    alignment: center
    colors:
      foreground: palette:primary
    font_size: 3
  subtitle:
    alignment: center
    colors:
      foreground: palette:muted
  event:
    alignment: center
    colors:
      foreground: palette:info
  location:
    alignment: center
    colors:
      foreground: palette:muted
  date:
    alignment: center
    colors:
      foreground: palette:primary
  author:
    alignment: center
    colors:
      foreground: palette:faint
    positioning: page_bottom
  footer: false
headings:
  h1:
    prefix: "▌"
    colors:
      foreground: palette:primary
  h2:
    prefix: "▌"
    colors:
      foreground: palette:info
  h3:
    prefix: "▸"
    colors:
      foreground: palette:success
  h4:
    prefix: "▸"
    colors:
      foreground: palette:magenta
  h5:
    prefix: "▸"
    colors:
      foreground: palette:cyan
  h6:
    prefix: "▸"
    colors:
      foreground: palette:muted
block_quote:
  prefix: "▍ "
  colors:
    foreground: palette:muted
    background: palette:raised
    prefix: palette:primary
alert:
  prefix: "▍ "
  base_colors:
    foreground: palette:text
    background: palette:raised
  styles:
    note:
      color: palette:info
    tip:
      color: palette:success
    important:
      color: palette:magenta
    warning:
      color: palette:primary
    caution:
      color: palette:error
typst:
  colors:
    foreground: palette:text
    background: palette:raised
footer:
  style: template
  left: "{title}"
  right: "{current_slide} / {total_slides}"
  colors:
    foreground: palette:faint
modals:
  selection_colors:
    foreground: palette:primary
mermaid:
  background: transparent
  theme: default
palette:
  colors:
    base: "fbfaf7"
    raised: "f1efea"
    elevated: "e9e6df"
    text: "1c1a17"
    muted: "5e5a53"
    faint: "88837a"
    primary: "865700"
    success: "0b7656"
    error: "b42318"
    info: "0663d0"
    magenta: "7c4bcb"
    cyan: "0a7187"
